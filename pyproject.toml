[project]
name = "hackathonus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.13",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# only for training the battery agent (uv sync --group rl); running it needs numpy alone
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
